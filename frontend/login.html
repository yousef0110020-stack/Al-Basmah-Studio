<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البصمة ستوديو">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<title>تسجيل الدخول · Al Basmah Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="panel login-card" id="f" autocomplete="on">
    <img src="/icons/icon-192.png" alt="Al Basmah" class="login-icon">
    <h2>Al Basmah <span class="gold">AI Media Studio</span></h2>
    <p class="muted small">استوديو البصمة للعقارات · Secure login</p>
    <input type="text" name="username" value="albasmah" autocomplete="username" hidden>
    <label class="field"><span>كلمة المرور · Password</span>
      <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus dir="ltr"></label>
    <button class="gold-btn wide" type="submit">دخول · Sign in</button>
    <div class="err small" id="msg"></div>
  </form>
</div>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById("msg"); msg.textContent = "";
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
    body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (r.ok) location.replace("/");
  else msg.textContent = r.status === 429 ? "محاولات كثيرة، حاول بعد 15 دقيقة · Too many attempts" : "كلمة المرور غير صحيحة · Wrong password";
};
</script>
</body>
</html>
